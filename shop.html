<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — ShopZone</title>
  <meta name="description" content="Browse all ShopZone products. Filter by category, price and rating.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
  <div id="site-header"></div>
  <main>
    <div class="page-hero">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Shop</span></div>
        <h1 id="shop-title">All Products</h1>
        <p>Find your next favourite. Filter by category, price or rating to narrow it down.</p>
      </div>
    </div>

    <section>
      <div class="container shop-layout">
        <aside class="filters panel" id="filters" aria-label="Filters">
          <div class="filter-group">
            <h4>Categories <button type="button" class="icon-btn" id="close-filters" style="width:32px;height:32px;display:none" aria-label="Close filters"><i data-i="x"></i></button></h4>
            <div id="cat-filters"></div>
          </div>
          <div class="filter-group">
            <h4>Max Price</h4>
            <input type="range" id="price" min="10" max="200" step="5" value="200" aria-label="Maximum price">
            <div class="range-val"><span>$10</span><b id="price-val" style="color:var(--accent)">$200</b></div>
          </div>
          <div class="filter-group">
            <h4>Minimum Rating</h4>
            <label class="check"><input type="radio" name="rating" value="0" checked> All ratings</label>
            <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 &amp; up</label>
            <label class="check"><input type="radio" name="rating" value="4"> 4.0 &amp; up</label>
          </div>
          <div class="filter-group">
            <label class="check"><input type="checkbox" id="on-sale"> On sale (20%+ off)</label>
          </div>
          <button class="btn btn-ghost btn-block" id="reset">Reset filters</button>
        </aside>

        <div>
          <div class="shop-top">
            <button class="btn btn-ghost btn-sm filter-toggle" id="open-filters"><i data-i="filter"></i> Filters</button>
            <div class="search-inline"><i data-i="search"></i><input type="search" id="shop-q" placeholder="Search in shop..." aria-label="Search in shop"></div>
            <p id="result-count"></p>
            <select id="sort" aria-label="Sort products">
              <option value="featured">Sort: Featured</option>
              <option value="new">Newest</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
          <div class="shop-grid" id="shop-grid"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="shop.js"></script>
</body>
</html>
