<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — ShopZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="wishlist">
  <div id="site-header"></div>
  <main>
    <div class="page-hero">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Wishlist</span></div>
        <h1>My Wishlist</h1>
        <p>Products you've saved for later.</p>
      </div>
    </div>
    <section><div class="container"><div class="grid-4" id="wish-grid"></div></div></section>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('shopzone:ready', () => {
      const list = Wish.get().map(getProduct).filter(Boolean);
      const grid = $('#wish-grid');
      if (!list.length) {
        grid.innerHTML = `<div class="panel empty" style="padding:80px 20px">${icon('heart')}<h3 style="margin-top:12px">Your wishlist is empty</h3><p>Tap the heart on any product to save it here.</p><a href="shop.html" class="btn btn-primary" style="margin-top:22px">Browse Products</a></div>`;
        return;
      }
      renderProducts(grid, list);
    });
  </script>
</body>
</html>
